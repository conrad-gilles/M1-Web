name: CI
on: [push, pull_request]

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: backend } }
    env:
      # Les tests unitaires n'utilisent pas MongoDB : inutile de le télécharger.
      MONGOMS_DISABLE_POSTINSTALL: "1"
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: backend/package-lock.json }
      - run: npm ci
      - run: npm test

  frontend:
    runs-on: ubuntu-latest
    defaults: { run: { working-directory: frontend } }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with: { node-version: 22, cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: npm ci
      - run: npm test
      - run: npm run build

  # Tests de bout en bout : vrais navigateurs, backend et base MongoDB locale.
  e2e:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: |
            backend/package-lock.json
            frontend/package-lock.json
            e2e/package-lock.json
      - name: Build Angular
        working-directory: frontend
        run: npm ci && npm run build
      - name: Dépendances du backend (avec MongoDB local)
        working-directory: backend
        run: npm ci
      - name: Playwright et Chromium
        working-directory: e2e
        run: npm ci && npx playwright install --with-deps chromium
      - name: Tests de bout en bout
        working-directory: e2e
        run: npx playwright test
      - name: Traces des tests en échec
        if: failure()
        uses: actions/upload-artifact@v7
        with: { name: playwright-traces, path: e2e/test-results, retention-days: 7 }

  # Déploiement sur Render, seulement après un push sur sharing-platform et
  # seulement si les trois jobs de tests ont réussi. L'URL du Deploy Hook est
  # secrète : elle est lue dans le secret GitHub RENDER_DEPLOY_HOOK.
  deploy:
    needs: [backend, frontend, e2e]
    if: github.event_name == 'push' && github.ref == 'refs/heads/sharing-platform'
    runs-on: ubuntu-latest
    steps:
      - name: Déclencher le déploiement Render
        env:
          RENDER_DEPLOY_HOOK: ${{ secrets.RENDER_DEPLOY_HOOK }}
        run: |
          if [ -z "$RENDER_DEPLOY_HOOK" ]; then
            echo "::warning::Secret RENDER_DEPLOY_HOOK absent : déploiement ignoré"
            exit 0
          fi
          curl -fsS -X POST "$RENDER_DEPLOY_HOOK" > /dev/null
          echo "Déploiement Render demandé"
